# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; n = 3.103 mỗi nhóm -> cần 42 nhân viên/nhóm (tổng 84 > 40: không đủ nhân sự)
#   c) 20 nhân viên mỗi nhóm: Giới hạn c / ICC = 20 / 0,02 = 1.000 < 1.251 (không đạt mẫu cho 5 điểm)
#   d) 6 depot mỗi nhóm: Giới hạn 6 / 0,02 = 300 < 1.251 (không đạt)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: Đạt khi m >= 299 yêu cầu/nhân viên (DE = 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: 20 nhân viên đối chứng làm việc song song cùng thời gian tại 12 depot.
#   2. Chia ngẫu nhiên hay do người chọn: Phân bổ ngẫu nhiên có cố định seed ngẫu nhiên, phân tầng đồng đều theo từng depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Rủi ro chia sẻ tài khoản được giảm thiểu bằng quyền truy cập cá nhân theo staff_id và giám sát log truy cập.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Đã công bố trước chỉ số chính, MDE 0,06, luật dừng và ngày chốt quyết định 2027-01-05.
#   5. Ít nhất 20 cụm mỗi nhóm: Đạt đúng 20 cụm (20 nhân viên) cho mỗi nhánh thử nghiệm.
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chấp nhận mục tiêu mức chênh phát hiện tối thiểu (MDE) là 6 điểm phần trăm thay vì 5 điểm; nếu mức chênh thực tế chỉ là 5 điểm thì power đạt khoảng 0,62.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Hiện tại toàn hệ thống là 4,25% (trong phạm vi noi_dia + hang_nang là 3,97%); đặt ngưỡng an toàn: cao hơn đối chứng >= 2 điểm phần trăm hoặc trần tuyệt đối vượt 6,0%.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang (0,22x và 0,69x so với 12.000 đ, simulated); loại bỏ quoc_te (1,88x) và doi_tac (0,85x)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "20 nhân viên đối chứng xử lý đồng thời song song tại 12 depot"
    spillover_risk: "Phân quyền theo tài khoản cá nhân staff_id, theo dõi log mở giao diện để phát hiện dùng chung tài khoản"
    predeclared: "Chỉ số chính, MDE 0,06, các ngưỡng luật dừng và ngày chốt quyết định được phê duyệt trước khi triển khai"
  stop_rules:
    - "NẾU tỉ lệ mở lại trong 7 ngày của nhóm trợ lý cao hơn nhóm đối chứng >= 2 điểm phần trăm hoặc vượt trần 6,0%, hoặc xuất hiện >= 1 ca hoàn tiền trùng lặp TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành kích hoạt cờ ngắt trợ lý trong 30 phút KHÔNG THÌ không được phép chuyển sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công vượt quá 8.000 đ [simulated] TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp phạm vi về chỉ xử lý noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được phép tiếp tục hỗ trợ hang_nang"
    - "NẾU tỉ lệ nhân viên bỏ qua gợi ý vượt quá 40% TRONG 1 tuần liên tiếp THÌ Trưởng nhóm CSKH tổ chức phỏng vấn chuyên sâu 5 nhân viên trong 3 ngày KHÔNG THÌ không được phép chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành tắt feature flag trên hệ thống trung tâm trong 30 phút; toàn bộ yêu cầu tự động chuyển về luồng nhân viên xử lý thủ công thông thường"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated"
    - "phut_lam_lai_simulated"
    - "chi_phi_moi_viec_thanh_cong = 4.472 đ"
    - "ti_le_lam_lai = 4,9%"
